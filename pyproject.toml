[project]
name = "bankguard-ai-grupo-04"
version = "0.1.0"
description = "BankGuard AI: Data Steward bancario del Grupo 04 con análisis transaccional y RAG PLD/FT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=25.9.0",
    "dotenv>=0.9.9",
    "duckdb>=1.5.6",
    "fastapi>=0.141.1",
    "fastmcp>=4.1.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.59.1",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "google-genai>=2.28.0",
    "isort>=6.1.0",
    "langchain[mcp]>=1.4",
    "langchain-google-genai>=4.4.1",
    "langchain-googledrive>=0.3.35",
    "langchain-ollama>=0.3.10",
    "langchain-openai>=0.3.35",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.12",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.1.1",
    "unstructured>=0.27.10",
    "uvicorn>=0.54.0",
    "google-adk>=2.12.0",
    "google-cloud-aiplatform>=2.5.0",
    "numpy>=2.5.3",
]

[tool.uv.workspace]
members = []
exclude = ["cloud_run_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: optional tests that require configured external services",
]

[tool.isort]
profile = "black"

